# This is a basic workflow to help you get started with Actions

name: Run Arxiv Papers Daily

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    - cron:  "0 0/24 * * *"  #'*/60 * * * *'
  # Triggers the workflow on push or pull request events but only for the main branch
#   push:
#     branches:
#     - main

env:
  GITHUB_USER_NAME: ultraclr
  GITHUB_USER_EMAIL: longrongchen@163.com


# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: update
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    environment: llm_client
    env:
      # 想用 DeepSeek 官方：ANTHROPIC_AUTH_TOKEN=sk-你的DeepSeekKey
      #                  CRS_BASE_URL=https://api.deepseek.com
      #                  CRS_MODEL=deepseek-chat
      # 变量名是历史遗留的叫法，实际就是「OpenAI 兼容接口的 key / 地址 / 模型」
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      CRS_BASE_URL: ${{ secrets.CRS_BASE_URL }}
      CRS_MODEL: ${{ secrets.CRS_MODEL }}
      # 可选：限制最大输出 token（DeepSeek 默认 4096，分析结果过长时会被截断）
      CRS_MAX_TOKENS: ${{ secrets.CRS_MAX_TOKENS }}
    
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: Set up Python Env
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          #architecture: 'x64' # optional x64 or x86. Defaults to x64 if not specified
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install arxiv requests pyyaml openai tqdm pdfminer.six

      - name: Run daily arxiv
        timeout-minutes: 30
        run: |
          python daily_arxiv.py

      - name: Analyze papers with LLM
        timeout-minutes: 150
        run: |
          cd analysis
          python pipeline.py \
            --api claude \
            --json_path ../docs/agent-arxiv-daily.json \
            --output_dir ./results \
            --delay_seconds 10 \
            --report_path ../docs/paper_analysis.md \
            --trends_file ../docs/agent_trends.txt \
            --max_papers 20 || echo "::warning::pipeline 非 0 退出：通常表示本轮没有新论文分析成功（全部已分析过，或部分论文 LLM 调用失败）。报告与邮件不受影响，请查看上方日志中的 Successful/Skipped/Failed 统计。"
        continue-on-error: true

      - name: Send DingTalk notification
        timeout-minutes: 10
        env:
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_WEBHOOK_SECRET: ${{ secrets.DINGTALK_WEBHOOK_SECRET }}
        run: |
          python send_webhook_notification.py
        continue-on-error: true

      - name: Send email notification
        if: always()                      # 前面步骤失败也尝试发邮件
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com     # QQ邮箱；163用 smtp.163.com；Gmail用 smtp.gmail.com
          server_port: 465
          secure: true                    # 465端口走SSL；Gmail用587则改为 false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}   # 注意：是SMTP授权码，不是登录密码！
          subject: 📚 arXiv 每日论文更新 (${{ github.run_number }})
          to: ${{ secrets.MAIL_TO }}
          from: arXiv Daily <${{ secrets.MAIL_USERNAME }}>
          html_body: file://docs/paper_analysis.md  # 必须是 html_body，convert_markdown 只对 html_body 生效
          convert_markdown: true                    # Markdown -> HTML（对 body 无效）

      # ---- 可选方案：改用 send_email.py 发送「当日新论文」摘要邮件（正文更小、排版更可控）----
      # 想用就把上面那段 dawidd6/action-send-mail 注释掉，打开下面这段：
      # - name: Send email notification (python)
      #   if: always()
      #   env:
      #     MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      #     MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      #     MAIL_TO: ${{ secrets.MAIL_TO }}
      #     REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      #   run: python send_email.py
      #   continue-on-error: true

      - name: Push updates
        uses: github-actions-x/commit@v2.9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Github Action Automatic Update: Papers and Analysis"
          files: README.md docs/agent-arxiv-daily.json docs/agent-arxiv-daily-web.json docs/index.md docs/agent-arxiv-daily-wechat.json docs/wechat.md docs/agent-arxiv-daily-analysis.json docs/paper_analysis.md blacklists.txt docs/agent_trends.txt
          rebase: 'true'
          name: ${{ env.GITHUB_USER_NAME }}
          email: ${{ env.GITHUB_USER_EMAIL }}
